<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5B3FA8" />
    <meta
      name="description"
      content="Keşif Kutusu bayi portalı ile ön sipariş, onay ve sipariş süreçlerinizi tek panelden yönetin."
    />

    <!-- Open Graph / WhatsApp / Facebook -->
    <!-- ÖNEMLİ: og:image MUTLAK URL olmalı. %PUBLIC_URL% derlemede boş stringe
         dönüşüp göreli yol bırakıyordu (/logo512.png) ve önizleme botları
         göreli görsel yolunu yok sayıyor. Bu yüzden tam adres yazıldı. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:site_name" content="Keşif Kutusu Bayi Portalı" />
    <meta property="og:title" content="Keşif Kutusu Bayi Portalı" />
    <meta property="og:description" content="Ön sipariş oluşturun, okul formunu doldurun, siparişlerinizi tek panelden takip edin." />
    <meta property="og:url" content="https://bayi.kesifkutusu.com.tr/" />
    <meta property="og:image" content="https://bayi.kesifkutusu.com.tr/logo512.png" />
    <meta property="og:image:secure_url" content="https://bayi.kesifkutusu.com.tr/logo512.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Keşif Kutusu logosu" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Keşif Kutusu Bayi Portalı" />
    <meta name="twitter:description" content="Ön sipariş oluşturun, okul formunu doldurun, siparişlerinizi tek panelden takip edin." />
    <meta name="twitter:image" content="https://bayi.kesifkutusu.com.tr/logo512.png" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Keşif Kutusu Bayi Portalı</title>
  </head>
